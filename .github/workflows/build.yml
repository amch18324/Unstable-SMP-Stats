name: Build LiveContainer IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Project
        run: |
          cordova create myapp com.example.myapp MyApp
          cd myapp
          cordova platform add ios

      - name: Copy All Assets and Folders into App
        run: |
          rm -rf myapp/www/*
          find . -maxdepth 1 -type f ! -name "README.md" ! -name ".gitignore" ! -name "img.zip" -exec cp {} myapp/www/ \;
          if [ -f img.zip ]; then
            unzip img.zip -d myapp/www/
          fi

      - name: Build Unsigned iOS Simulator Framework
        run: |
          cd myapp
          cordova build ios --emulator --codeSignIdentity="-" --developmentTeam="-"

      - name: Package into IPA via Deep Scan
        run: |
          mkdir -p Payload
          
          # Automatically search the full workspace folder to find where Xcode compiled the .app payload
          APP_PATH=$(find myapp/platforms/ios -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not locate compiled application file anywhere in workspace structure."
            exit 1
          fi
          
          echo "Found application bundle layout path at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r MyApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: livecontainer-ipa
          path: MyApp.ipa
